name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version already published
        id: version-check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

          PUBLISHED_VERSIONS=$(npm view "$PACKAGE_NAME" versions --json 2>/dev/null || echo "[]")
          if echo "$PUBLISHED_VERSIONS" | node -e "
            const versions = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const arr = Array.isArray(versions) ? versions : [versions];
            process.exit(arr.includes('$LOCAL_VERSION') ? 0 : 1);
          "; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $LOCAL_VERSION already exists on npm. Skipping publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $LOCAL_VERSION is new. Will publish."
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish
        if: steps.version-check.outputs.exists == 'true'
        run: echo "Skipped - v${{ steps.version-check.outputs.version }} already on npm."
